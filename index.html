<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Oyelabs Trails: the internal learning roadmap for the Oyelabs dev team." />
    <meta name="theme-color" content="#F5F6F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12151C" media="(prefers-color-scheme: dark)" />
    <title>Oyelabs Trails</title>
    <script>
      // Apply the saved theme before first paint so there's no light/dark flash.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("oyelabs-theme") || "null");
          var theme = saved && saved.state && saved.state.theme;
          if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
