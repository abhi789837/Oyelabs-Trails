<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Oyelearn</title>
    <meta name="description" content="Oyelearn: the internal learning platform for the Oyelabs dev team. Assessed learning paths across the stack, from your first year to your tenth." />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="theme-color" content="#2067D3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A1428" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oyelearn" />
    <meta property="og:title" content="Oyelearn" />
    <meta property="og:description" content="The internal learning platform for the Oyelabs dev team." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oyelearn" />
    <meta name="twitter:description" content="The internal learning platform for the Oyelabs dev team." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Fonts are self-hosted via @fontsource; see src/main.tsx. -->

    <script>
      // Apply the saved theme before first paint so there's no light/dark flash.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("oyelabs-ui") || "null");
          var theme = saved && saved.state && saved.state.theme;
          if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
