<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Oyelearn</title>
    <meta name="description" content="Oyelearn: learning never closes. The internal learning platform for the Oyelabs team, with your plan at your pace." />
    <meta name="application-name" content="Oyelearn" />
    <meta name="apple-mobile-web-app-title" content="Oyelearn" />

    <!-- Brand kit v1.0 favicons. `?v=2` busts caches still holding the previous logo (the manifest
         is always sent no-cache, so it needs none). -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png?v=2" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png?v=2" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta name="theme-color" content="#2067D3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A1428" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oyelearn" />
    <meta property="og:url" content="https://learn.oyegen.com/" />
    <meta property="og:title" content="Oyelearn" />
    <meta property="og:description" content="Learning never closes. The internal learning platform for the Oyelabs team." />
    <meta property="og:image" content="https://learn.oyegen.com/og-image.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Oyelearn: learning never closes." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Oyelearn" />
    <meta name="twitter:description" content="Learning never closes. The internal learning platform for the Oyelabs team." />
    <meta name="twitter:image" content="https://learn.oyegen.com/og-image.png?v=2" />
    <meta name="twitter:image:alt" content="Oyelearn: learning never closes." />

    <!-- Fonts are self-hosted via @fontsource (src/fonts/brandFonts.ts); the build preloads Outfit. -->

    <script>
      // Apply the saved theme before first paint so there's no light/dark flash.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem("oyelabs-ui") || "null");
          var theme = saved && saved.state && saved.state.theme;
          if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
