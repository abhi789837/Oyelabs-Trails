# Oyelearn v4.
#
#   cp .env.example .env    # then fill in APP_MASTER_KEY and SESSION_SECRET
#   docker compose up -d --build
#   ./scripts/deploy/piston-install.sh    # once: installs the code-runner languages (~3 GB)
#
# The app listens on 127.0.0.1:8787 and Caddy terminates TLS in front of it (Caddyfile.example).
# The code runner (Piston) is on an internal network only the app can reach; nothing new is
# published on any interface.

services:
  oyelearn:
    build:
      context: .
      args:
        # Only needed for the claude-cli / codex-cli AI adapters; an API key needs neither.
        # Read from the environment (.env) rather than pinned here, because a literal "0" meant
        # every `docker compose up -d --build` quietly rebuilt without the CLI and undid an
        # install done with `--build-arg`. Set INSTALL_CLAUDE_CLI=1 in .env to make it stick.
        INSTALL_CLAUDE_CLI: "${INSTALL_CLAUDE_CLI:-0}"
        INSTALL_CODEX_CLI: "${INSTALL_CODEX_CLI:-0}"
    image: oyelearn:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "8787"
      PISTON_URL: http://piston:2000
      PISTON_RUN_TIMEOUT_MS: "3000"
    ports:
      # Bound to loopback on purpose: Caddy is the only thing that should reach it.
      - "127.0.0.1:8787:8787"
    volumes:
      # SQLite, proctoring snapshots and nightly backups. This is the only state that matters.
      - oyelearn-data:/data
    networks:
      - default
      - code_net
    depends_on:
      - piston
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # JavaScript submissions run in an isolated V8 inside this process; a cap means one runaway
    # submission cannot take the host down with it.
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true

  # v4: the code runner for Python, PHP, SQL, Java and Dart (docs/v4/RESEARCH_SANDBOX_AI.md).
  # Piston's isolate sandbox needs `privileged` and a cgroup v2 host. It has no published port and
  # sits on an internal network with no egress, so the only thing that can reach it is the app.
  piston:
    image: ghcr.io/engineer-man/piston@sha256:2f66b7456189c4d713aa986d98eccd0b6ee16d26c7ec5f21b30e942756fd127a
    restart: unless-stopped
    privileged: true
    networks:
      - code_net
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec
    environment:
      PISTON_DISABLE_NETWORKING: "true"
      PISTON_RUN_TIMEOUT: "3000"
      PISTON_COMPILE_TIMEOUT: "10000"
      PISTON_RUN_MEMORY_LIMIT: "268435456"
      PISTON_OUTPUT_MAX_SIZE: "65536"
      PISTON_MAX_PROCESS_COUNT: "64"
      PISTON_MAX_CONCURRENT_JOBS: "4"
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 1024
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  code_net:
    internal: true

volumes:
  oyelearn-data:
    driver: local
  piston-packages:
    driver: local
