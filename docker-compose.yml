# Oyelearn v4.
#
#   cp .env.example .env    # then fill in APP_MASTER_KEY and SESSION_SECRET
#   docker compose up -d --build
#
# Deploying an update is one command:  git pull && docker compose up -d --build
# The app backs the database up before any new migration, and installs the code runner's
# languages in the background on first boot (~3 GB, kept in the piston-packages volume).
#
# The app listens on 127.0.0.1:8787 and Caddy terminates TLS in front of it (Caddyfile.example).
# The code runner (Piston) is on an internal network only the app can reach; nothing new is
# published on any interface.
#
# v4.4: speech-to-text (whisper) is on its own internal network with no internet access, so its
# model is downloaded once, before the first start:  scripts/deploy/whisper-model.sh

services:
  oyelearn:
    build:
      context: .
      args:
        # Only needed for the claude-cli / codex-cli AI adapters; an API key needs neither.
        # Read from the environment (.env) rather than pinned here, because a literal "0" meant
        # every `docker compose up -d --build` quietly rebuilt without the CLI and undid an
        # install done with `--build-arg`. Set INSTALL_CLAUDE_CLI=1 in .env to make it stick.
        INSTALL_CLAUDE_CLI: "${INSTALL_CLAUDE_CLI:-0}"
        INSTALL_CODEX_CLI: "${INSTALL_CODEX_CLI:-0}"
    image: oyelearn:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "8787"
      PISTON_URL: http://piston:2000
      PISTON_RUN_TIMEOUT_MS: "5000"
      # v4.4: Speak answers are transcribed here. Unset it to turn transcription off
      # (recordings are still kept and marked "unavailable").
      STT_BASE_URL: http://whisper:8080
    ports:
      # Bound to loopback on purpose: Caddy is the only thing that should reach it.
      - "127.0.0.1:8787:8787"
    volumes:
      # SQLite, proctoring snapshots and nightly backups. This is the only state that matters.
      - oyelearn-data:/data
    networks:
      - default
      - code_net
      - stt_net
    depends_on:
      - piston
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # JavaScript submissions run in an isolated V8 inside this process; a cap means one runaway
    # submission cannot take the host down with it.
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true

  # v4: the code runner for Python, PHP, SQL, Java and Dart (docs/v4/RESEARCH_SANDBOX_AI.md).
  # Piston's isolate sandbox needs `privileged` and a cgroup v2 host. It has no published port, so
  # only containers on `code_net` (the app) can reach it. The network is not `internal`, so the
  # app can install language packages on first boot; learner code itself never has network
  # access — PISTON_DISABLE_NETWORKING removes it inside every run.
  piston:
    image: ghcr.io/engineer-man/piston@sha256:2f66b7456189c4d713aa986d98eccd0b6ee16d26c7ec5f21b30e942756fd127a
    restart: unless-stopped
    privileged: true
    networks:
      - code_net
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /tmp:exec
    environment:
      PISTON_DISABLE_NETWORKING: "true"
      PISTON_RUN_TIMEOUT: "5000"
      PISTON_COMPILE_TIMEOUT: "10000"
      PISTON_RUN_MEMORY_LIMIT: "268435456"
      PISTON_OUTPUT_MAX_SIZE: "65536"
      PISTON_MAX_PROCESS_COUNT: "64"
      PISTON_MAX_CONCURRENT_JOBS: "4"
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 1024
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # v4.4: speech-to-text for Speak answers (docs/v4.4/research/whisper-benchmark.md).
  # whisper.cpp's server, rebuilt from the upstream image for portable CPUs (the published image
  # is compiled for its CI runner's CPU and crashes with SIGILL elsewhere; see the Dockerfile).
  # OpenAI-shaped endpoint: POST /v1/audio/transcriptions. `--convert` runs ffmpeg so WebM/Ogg/MP4
  # from browsers is accepted. No published port and an `internal` network: only the app can
  # reach it, and it has no internet access, so the model is pre-seeded into `whisper-models` by
  # scripts/deploy/whisper-model.sh (the `whisper-model` service below).
  whisper:
    build: ./scripts/deploy/whisper
    image: oyelearn-whisper:latest
    restart: unless-stopped
    command:
      - >-
        [ -s /models/ggml-base.en.bin ] || { echo "whisper: model missing. Run scripts/deploy/whisper-model.sh"; sleep 60; exit 1; };
        exec whisper-server --host 0.0.0.0 --port 8080 -m /models/ggml-base.en.bin -t 3
        --convert --inference-path /v1/audio/transcriptions
    networks:
      - stt_net
    volumes:
      - whisper-models:/models:ro
    tmpfs:
      # --convert writes a WAV per request here.
      - /tmp:size=256m
    read_only: true
    cpus: "3.0"
    mem_limit: 1g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # One-shot model download into the `whisper-models` volume. Not started by `up` (profile);
  # run through scripts/deploy/whisper-model.sh. On the default network, so it has internet.
  whisper-model:
    image: oyelearn-whisper:latest
    profiles: ["setup"]
    user: "0:0"
    restart: "no"
    networks:
      - default
    volumes:
      - whisper-models:/models
    command: ["exec download-model.sh"]

networks:
  code_net: {}
  # Internal: no route out. Only `oyelearn` and `whisper` are on it.
  stt_net:
    internal: true

volumes:
  oyelearn-data:
    driver: local
  piston-packages:
    driver: local
  whisper-models:
    driver: local
